# 진단용: UVCAndroid 라이브러리 소스에서 오류 문구가 나오는 위치를 찾아 릴리스(diag)에 첨부
name: Inspect UVC library
on:
  push:
    paths: [".github/workflows/inspect-lib.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          git clone --depth 1 https://github.com/shiyinghan/UVCAndroid uvc
          cd uvc
          {
            echo "=== git log ==="; git log -1 --format='%H %cd'
            echo "=== grep occupied ==="; grep -rn -i "occupied" --include=*.java --include=*.cpp --include=*.c --include=*.h . | head -50
            echo "=== files ==="; find . -name "*.java" -path "*uvcapp*" | head -80
          } > ../diag.txt
          mkdir -p ../src
          for f in $(grep -rl -i "occupied" --include=*.java .) $(find . -name CameraHelper.java -o -name ICameraHelper.java -o -name CameraConnectionService.java -o -name UVCCamera.java -o -name USBMonitor.java -o -name CameraInternal.java | head -20); do
            cp "$f" ../src/ 2>/dev/null || true
          done
          cd .. && tar czf uvc-src.tgz src diag.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: diag
          name: diag
          prerelease: true
          files: |
            diag.txt
            uvc-src.tgz
