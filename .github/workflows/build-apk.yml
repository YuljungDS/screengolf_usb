# GitHub에 올리면 자동으로 APK를 빌드하고 "Releases"에 올립니다.
# 휴대폰에서 Releases 페이지의 ScreenGolf.apk 를 눌러 바로 내려받아 설치할 수 있습니다.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (러너에 기본 설치된 SDK 사용)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ScreenGolf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenGolf-debug-apk
          path: ScreenGolf.apk
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 폰 스크린골프 최신 APK
          body: 최신 커밋에서 자동 빌드된 디버그 APK입니다. 휴대폰에서 ScreenGolf.apk 를 눌러 내려받아 설치하세요.
          files: ScreenGolf.apk
          make_latest: true
