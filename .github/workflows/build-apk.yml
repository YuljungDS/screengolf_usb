# GitHub에 올리면 자동으로 APK를 빌드하고 "Releases"에 올립니다.
# 휴대폰에서 Releases 페이지의 ScreenGolf.apk 를 눌러 바로 내려받아 설치할 수 있습니다.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ScreenGolf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenGolf-debug-apk
          path: ScreenGolf.apk
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 폰 스크린골프 최신 APK
          body: 최신 커밋에서 자동 빌드된 디버그 APK입니다. 휴대폰에서 ScreenGolf.apk 를 눌러 내려받아 설치하세요.
          files: ScreenGolf.apk
          make_latest: true
